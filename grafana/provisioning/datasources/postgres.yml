apiVersion: 1
datasources:
  - name: Postgres lab
    uid: pglab
    type: grafana-postgresql-datasource
    url: postgres-lab:5432
    user: monitor_user
    isDefault: true
    jsonData:
      database: lab
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${MONITOR_PASSWORD}
  # TimescaleDB (opcional: docker compose --profile timescale up -d)
  - name: Timescale lab
    uid: tslab
    type: grafana-postgresql-datasource
    url: timescale-lab:5432
    user: grafana_ts
    jsonData:
      database: historico
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: ${MONITOR_PASSWORD}
